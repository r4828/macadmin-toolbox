name: Scorecard

# OpenSSF Scorecard, which is free for public repositories and produces the
# badge in the README.
#
# `publish_results: true` is deliberate and outward-facing: it sends the score
# to the public OpenSSF API, which is what makes the badge resolvable by anyone
# rather than only by someone with access to this repository's Security tab.
# That is the point of running it on a repository published for other people to
# use. Set it to false if this ever becomes something to keep private, and the
# badge stops working at the same time.

on:
  # Scorecard grades branch protection, so a change to it should re-grade.
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # security-events: to file results in the Security tab.
      # id-token:        to publish results via the OpenSSF API.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results as an artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: results.sarif
